spring.application.name=location-service
server.port=8082

# Conexão com o Banco (Docker usa o nome do serviço 'postgres')
spring.datasource.url=jdbc:postgresql://postgres:5432/incluicity_db
spring.datasource.username=admin
spring.datasource.password=admin123

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

springdoc.api-docs.path=/locations/v3/api-docs
springdoc.swagger-ui.path=/locations/swagger-ui.html