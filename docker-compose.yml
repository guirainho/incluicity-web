version: '3.8'

services:
  # Banco de Dados Local (Simulando o RDS)
  postgres:
    image: postgres:15-alpine
    container_name: incluicity-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: incluicity_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - incluicity-net

  # API Gateway (A porta de entrada)
  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - auth-service
      - location-service
      - review-service
    networks:
      - incluicity-net

  # Microsserviço de Autenticação
  auth-service:
    build: ./auth-service
    container_name: auth-service
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/incluicity_db
      - SPRING_DATASOURCE_USERNAME=admin
      - SPRING_DATASOURCE_PASSWORD=admin123
    depends_on:
      - postgres
    networks:
      - incluicity-net

  # Microsserviço de Localização
  location-service:
    build: ./location-service
    container_name: location-service
    ports:
      - "8082:8082"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/incluicity_db
      - SPRING_DATASOURCE_USERNAME=admin
      - SPRING_DATASOURCE_PASSWORD=admin123
    depends_on:
      - postgres
    networks:
      - incluicity-net

  # Microsserviço de Avaliações
  review-service:
    build: ./review-service
    container_name: review-service
    ports:
      - "8083:8083" 
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/incluicity_db
      - SPRING_DATASOURCE_USERNAME=admin
      - SPRING_DATASOURCE_PASSWORD=admin123
    depends_on:
      - postgres
    networks:
      - incluicity-net

  # Frontend em React
  frontend:
    build: ./incluicity-ui
    container_name: incluicity-ui
    ports:
      - "3000:3000"
    depends_on:
      - api-gateway
    networks:
      - incluicity-net

networks:
  incluicity-net:
    driver: bridge

volumes:
  pgdata: