name: IncluiCity CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-backend:
    name: Test Backend (location-service)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run Tests with Maven
        working-directory: ./location-service
        run: mvn test

  build-frontend:
    name: Build Frontend (React)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: incluicity-ui/package-lock.json
          
      - name: Install dependencies
        working-directory: ./incluicity-ui
        run: npm install
        
      - name: Build React App 
        working-directory: ./incluicity-ui
        run: npm run build

  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: [test-backend, build-frontend] # Só inicia se o teste e o build passarem de primeira!
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' # Impede deploy automático durante Pull Requests pendentes
    steps:
      - name: Executar comandos de Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ~/incluicity-web
            git reset --hard
            git pull origin main
            
            cd api-gateway
            JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64 mvn clean package -DskipTests
            
            cd ../auth-service
            JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64 mvn clean package -DskipTests
            
            cd ..
            sudo docker compose up -d --build api-gateway auth-service