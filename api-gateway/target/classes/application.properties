spring.application.name=api-gateway
server.port=8080

# Nível de log em DEBUG para acompanhar o filtro validando os tokens
logging.level.org.springframework.cloud.gateway=DEBUG

# 1. Rota Pública: Auth Service (Porta 8081)
# Aberta para permitir Login e Registro
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=http://auth-service:8081
spring.cloud.gateway.routes[0].predicates[0]=Path=/auth/**

# 2. Rota Protegida: Location Service (Porta 8082)
spring.cloud.gateway.routes[1].id=location-service
spring.cloud.gateway.routes[1].uri=http://location-service:8082
spring.cloud.gateway.routes[1].predicates[0]=Path=/locations, /locations/**
spring.cloud.gateway.routes[1].filters[0]=AuthenticationFilter

# 3. Rota Protegida: Review Service (Porta 8083)
spring.cloud.gateway.routes[2].id=review-service
spring.cloud.gateway.routes[2].uri=http://review-service:8083
spring.cloud.gateway.routes[2].predicates[0]=Path=/reviews, /reviews/**
spring.cloud.gateway.routes[2].filters[0]=AuthenticationFilter

# Configuração do Swagger Centralizado
springdoc.swagger-ui.urls[0].name=1. Auth Service
springdoc.swagger-ui.urls[0].url=/auth/v3/api-docs
springdoc.swagger-ui.urls[1].name=2. Location Service
springdoc.swagger-ui.urls[1].url=/locations/v3/api-docs
springdoc.swagger-ui.urls[2].name=3. Review Service
springdoc.swagger-ui.urls[2].url=/reviews/v3/api-docs